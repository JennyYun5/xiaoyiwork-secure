<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow,noarchive">
<title>私人工作台 · PIN码解锁</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#f7efe5,#e7efe8);color:#34332f}.card{width:min(100%,390px);background:rgba(255,255,255,.96);border-radius:28px;padding:32px 26px;box-shadow:0 20px 65px rgba(70,57,40,.13);text-align:center}.lock{width:58px;height:58px;margin:0 auto 18px;display:grid;place-items:center;border-radius:20px;background:#f4eadf;font-size:28px}.badge{font-size:12px;letter-spacing:2px;color:#94765b;font-weight:700}.title{font-size:26px;font-weight:800;margin:10px 0 8px}.sub{font-size:14px;line-height:1.7;color:#7d786f;margin:0 0 24px}.form{text-align:left}.label{display:block;font-size:13px;font-weight:700;margin:0 0 8px;color:#625c54}.row{display:flex;gap:9px}input{min-width:0;flex:1;height:48px;border:1px solid #ddd4c9;border-radius:14px;padding:0 14px;font-size:17px;outline:none;background:#fff}input:focus{border-color:#a7896c;box-shadow:0 0 0 3px rgba(167,137,108,.13)}button{height:48px;border:0;border-radius:14px;padding:0 18px;background:#725d49;color:#fff;font-size:15px;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.message{min-height:24px;margin:14px 0 0;font-size:13px;line-height:1.6;color:#a15454}.hint{margin:20px 0 0;padding-top:17px;border-top:1px solid #eee7df;font-size:12px;line-height:1.7;color:#989087}.pin-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.pin-row input{width:100%;min-width:0;height:54px;padding:0;border:1px solid #ddd4c9;border-radius:13px;text-align:center;font-size:24px;font-weight:800;caret-color:#725d49}.pin-row input:disabled{background:#f5f2ee}.pin-row input:focus{border-color:#a7896c;box-shadow:0 0 0 3px rgba(167,137,108,.13)}#unlock{width:100%;margin-top:14px}.progress{height:5px;background:#eee7df;border-radius:9px;overflow:hidden;margin-top:15px;display:none}.bar{height:100%;width:0;background:#9a8065;transition:width .2s}.foot{position:fixed;bottom:16px;font-size:11px;color:#9b968e}
</style>
</head>
<body>
<main class="card" id="card">
<div class="lock">🔒</div><div class="badge">PRIVATE SPACE</div>
<h1 class="title">私人工作台</h1>
<p class="sub">内容已加密，输入6位数字PIN码<br>即可在这台设备上解锁显示。</p>
<form class="form" id="form"><label class="label">访问PIN码</label><div class="pin-row" id="pinRow"><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="PIN第1位" required autofocus><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN第2位" required><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN第3位" required><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN第4位" required><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN第5位" required><input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="PIN第6位" required></div><button id="unlock" type="submit">解锁工作台</button></form>
<p class="message" id="message" aria-live="polite"></p><div class="progress" id="progress"><div class="bar" id="bar"></div></div>
<p class="hint">PIN码不会发送到服务器或写入网址。<br>员工状态、文件与视频均在浏览器本地解密。</p>
</main><div class="foot">Encrypted personal workspace</div>
<script>
const form=document.getElementById('form'),inputs=[...document.querySelectorAll('#pinRow input')],button=document.getElementById('unlock'),message=document.getElementById('message'),progress=document.getElementById('progress'),bar=document.getElementById('bar'),pinValue=()=>inputs.map(x=>x.value).join(''),sessionKey='xw-private-pin-v1';
const decoder=new TextDecoder(),encoder=new TextEncoder(),build='b7ada8767801ae82',withBuild=path=>path+(path.includes('?')?'&':'?')+'v='+encodeURIComponent(build);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(envelope,key){const iv=b64(envelope.iv),data=b64(envelope.data);return crypto.subtle.decrypt({name:'AES-GCM',iv},key,data)}
async function unlock(password){
 const config=await fetch(withBuild('config.json'),{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('配置读取失败');return r.json()});
 const material=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(config.salt),iterations:config.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 try{const verified=decoder.decode(await decrypt(config.verification,key));if(verified!=='xiaoyiwork-pin-v1')throw Error()}catch(e){throw Error('PIN码不正确，请重新输入6位数字')}
 message.textContent='PIN码正确，正在载入工作台…';
 const envelope=await fetch(withBuild('page.json'),{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('页面读取失败');return r.json()});
 let payload;try{payload=JSON.parse(decoder.decode(await decrypt(envelope,key)))}catch(e){throw Error('加密内容已更新，请刷新页面后重试')}
 const deferred=Object.entries(payload.assets||{}).filter(([id,mime])=>mime.startsWith('video/')),assetUrls={},assetPromises={};
 const loadWorkbenchAsset=async id=>{
  if(assetUrls[id])return assetUrls[id];
  if(!assetPromises[id])assetPromises[id]=(async()=>{const mime=payload.assets[id];if(!mime)throw Error('成果不存在');const asset=await fetch(withBuild('assets/'+id+'.json'),{cache:'default'}).then(r=>{if(!r.ok)throw Error('成果读取失败');return r.json()}),bytes=await decrypt(asset,key),url=URL.createObjectURL(new Blob([bytes],{type:mime}));assetUrls[id]=url;return url})().catch(e=>{delete assetPromises[id];throw e});
  return assetPromises[id]
 };
 window.workbenchAssetUrl=loadWorkbenchAsset;
 sessionStorage.setItem(sessionKey,password);
 const parsed=new DOMParser().parseFromString(payload.html,'text/html');document.title=parsed.title||'私人工作台';
 const frame=document.createElement('iframe');frame.title='已解锁的私人工作台';frame.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5efe7';
 frame.addEventListener('load',async()=>{deferred.sort((a,b)=>Number(!a[0].startsWith('employee-'))-Number(!b[0].startsWith('employee-')));const readFrameVar=async name=>{for(let i=0;i<6;i++){try{const v=frame.contentWindow.eval(`(typeof ${name}!=='undefined'?${name}:null)`);if(v)return v}catch(e){}await new Promise(r=>setTimeout(r,700))}return null},videoSources=await readFrameVar('employeeVideoSources'),teamData=await readFrameVar('embeddedTeam');for(const [id,mime] of deferred){try{const url=await loadWorkbenchAsset(id),replace=o=>{if(typeof o==='string')return o.split('asset:'+id).join(url);if(Array.isArray(o)){o.forEach((v,i)=>o[i]=replace(v));return o}if(o&&typeof o==='object'){Object.keys(o).forEach(k=>o[k]=replace(o[k]))}return o};if(videoSources)replace(videoSources);if(teamData)replace(teamData);frame.contentDocument.querySelectorAll('video').forEach(video=>{if(video.getAttribute('src')==='asset:'+id||video.dataset.assetSrc==='asset:'+id){video.src=url;video.load();video.play().then(()=>{const tip=frame.contentDocument.getElementById('playTip');if(tip)tip.classList.remove('show')}).catch(()=>{})}})}catch(e){console.error(e.message)}}},{once:true});
 const assetOpener='<script>window.openResultUrl=async function(url){if(!url)return;if(typeof url==="string"&&url.startsWith("asset:")){const w=window.open("","_blank");try{if(w){w.document.write("成果加载中，请稍候…");w.document.close()}const resolved=await parent.workbenchAssetUrl(url.slice(6));if(w)w.location.href=resolved;else window.open(resolved,"_blank")}catch(e){if(w)w.close();alert("成果加载失败，请刷新后重试")}}else window.open(url,"_blank")};<\/script>';
 document.body.style.cssText='margin:0;display:block;min-height:100vh;padding:0;overflow:hidden';document.body.replaceChildren(frame);frame.srcdoc=payload.html.replace('</body>',assetOpener+'</body>');
}
form.addEventListener('submit',async event=>{event.preventDefault();const pin=pinValue();if(!/^\d{6}$/.test(pin)){message.textContent='请输入完整的6位数字PIN码';return}button.disabled=true;inputs.forEach(x=>x.disabled=true);message.textContent='正在验证并解锁…';try{await unlock(pin)}catch(e){sessionStorage.removeItem(sessionKey);message.textContent=e.message||'解锁失败，请重试';button.disabled=false;inputs.forEach(x=>{x.disabled=false;x.value=''});inputs[0].focus()}});
inputs.forEach((input,index)=>{input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(-1);if(input.value&&index<inputs.length-1)inputs[index+1].focus();if(pinValue().length===6&&!button.disabled)form.requestSubmit()});input.addEventListener('keydown',event=>{if(event.key==='Backspace'&&!input.value&&index>0)inputs[index-1].focus()});input.addEventListener('paste',event=>{const digits=(event.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(digits.length===6){event.preventDefault();inputs.forEach((x,i)=>x.value=digits[i]);inputs[5].focus();form.requestSubmit()}})});
const remembered=sessionStorage.getItem(sessionKey);if(remembered&&/^\d{6}$/.test(remembered)){inputs.forEach((x,i)=>x.value=remembered[i]);form.requestSubmit()}
</script>
</body></html>
