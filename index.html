<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow,noarchive">
<title>私人工作台 · 密码解锁</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#f7efe5,#e7efe8);color:#34332f}.card{width:min(100%,390px);background:rgba(255,255,255,.96);border-radius:28px;padding:32px 26px;box-shadow:0 20px 65px rgba(70,57,40,.13);text-align:center}.lock{width:58px;height:58px;margin:0 auto 18px;display:grid;place-items:center;border-radius:20px;background:#f4eadf;font-size:28px}.badge{font-size:12px;letter-spacing:2px;color:#94765b;font-weight:700}.title{font-size:26px;font-weight:800;margin:10px 0 8px}.sub{font-size:14px;line-height:1.7;color:#7d786f;margin:0 0 24px}.form{text-align:left}.label{display:block;font-size:13px;font-weight:700;margin:0 0 8px;color:#625c54}.row{display:flex;gap:9px}input{min-width:0;flex:1;height:48px;border:1px solid #ddd4c9;border-radius:14px;padding:0 14px;font-size:17px;outline:none;background:#fff}input:focus{border-color:#a7896c;box-shadow:0 0 0 3px rgba(167,137,108,.13)}button{height:48px;border:0;border-radius:14px;padding:0 18px;background:#725d49;color:#fff;font-size:15px;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.message{min-height:24px;margin:14px 0 0;font-size:13px;line-height:1.6;color:#a15454}.hint{margin:20px 0 0;padding-top:17px;border-top:1px solid #eee7df;font-size:12px;line-height:1.7;color:#989087}.progress{height:5px;background:#eee7df;border-radius:9px;overflow:hidden;margin-top:15px;display:none}.bar{height:100%;width:0;background:#9a8065;transition:width .2s}.foot{position:fixed;bottom:16px;font-size:11px;color:#9b968e}
</style>
</head>
<body>
<main class="card" id="card">
<div class="lock">🔒</div><div class="badge">PRIVATE SPACE</div>
<h1 class="title">私人工作台</h1>
<p class="sub">内容已加密，只有输入正确密码<br>才会在这台设备上解锁显示。</p>
<form class="form" id="form"><label class="label" for="password">访问密码</label><div class="row"><input id="password" type="password" autocomplete="current-password" required autofocus><button id="unlock" type="submit">解锁</button></div></form>
<p class="message" id="message" aria-live="polite"></p><div class="progress" id="progress"><div class="bar" id="bar"></div></div>
<p class="hint">密码不会发送到服务器或写入网址。<br>员工状态、文件与视频均在浏览器本地解密。</p>
</main><div class="foot">Encrypted personal workspace</div>
<script>
const form=document.getElementById('form'),input=document.getElementById('password'),button=document.getElementById('unlock'),message=document.getElementById('message'),progress=document.getElementById('progress'),bar=document.getElementById('bar');
const decoder=new TextDecoder(),encoder=new TextEncoder();
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(envelope,key){const iv=b64(envelope.iv),data=b64(envelope.data);return crypto.subtle.decrypt({name:'AES-GCM',iv},key,data)}
async function unlock(password){
 const config=await fetch('config.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('配置读取失败');return r.json()});
 const material=await crypto.subtle.importKey('raw',encoder.encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(config.salt),iterations:config.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
 const envelope=await fetch('page.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('页面读取失败');return r.json()});
 let payload;try{payload=JSON.parse(decoder.decode(await decrypt(envelope,key)))}catch(e){throw Error('密码不正确，请重试')}
 const entries=Object.entries(payload.assets||{});let done=0;progress.style.display='block';
 for(const [id,mime] of entries){
  message.textContent='正在解密成果 '+(++done)+' / '+entries.length;bar.style.width=(done/Math.max(1,entries.length)*100)+'%';
  const asset=await fetch('assets/'+id+'.json',{cache:'default'}).then(r=>{if(!r.ok)throw Error('成果读取失败');return r.json()});
  const bytes=await decrypt(asset,key),url=URL.createObjectURL(new Blob([bytes],{type:mime}));
  payload.html=payload.html.split('asset:'+id).join(url);
 }
 sessionStorage.setItem('xw-private-pass',password);
 const parsed=new DOMParser().parseFromString(payload.html,'text/html');document.title=parsed.title||'私人工作台';
 const frame=document.createElement('iframe');frame.title='已解锁的私人工作台';frame.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;background:#f5efe7';
 document.body.style.cssText='margin:0;display:block;min-height:100vh;padding:0;overflow:hidden';document.body.replaceChildren(frame);frame.srcdoc=payload.html;
}
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;input.disabled=true;message.textContent='正在验证并解锁…';try{await unlock(input.value)}catch(e){sessionStorage.removeItem('xw-private-pass');message.textContent=e.message||'解锁失败，请重试';button.disabled=false;input.disabled=false;input.focus();input.select()}});
const remembered=sessionStorage.getItem('xw-private-pass');if(remembered){input.value=remembered;form.requestSubmit()}
</script>
</body></html>
